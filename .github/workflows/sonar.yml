# SonarQube Cloud 품질 분석. SONAR_TOKEN이 아직 없으면 건너뛴다
name: SonarQube Cloud

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0   # 새로 바뀐 줄을 가리려면 이력이 필요하다

      - uses: SonarSource/sonarqube-scan-action@v8
        if: env.SONAR_TOKEN != ''
